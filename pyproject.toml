[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omniturn-cam"
dynamic = ["version"]
description = "Conversational 2D lathe CAM for OmniTurn gang-tool lathes: profile in, OmniTurn G-code out"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["tomli-w>=1.0", "numpy>=1.24"]   # numpy: STL/3MF import

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
gui = ["PySide6-Essentials>=6.5", "matplotlib>=3.7"]
step = ["cadquery-ocp>=7.7"]
all = ["PySide6-Essentials>=6.5", "matplotlib>=3.7", "cadquery-ocp>=7.7"]
dev = ["pytest>=7", "matplotlib>=3.7", "ruff==0.16.9"]

[project.scripts]
omniturn-cam = "omniturn_cam.cli:main"

[project.gui-scripts]
omniturn-cam-gui = "omniturn_cam.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.setuptools.dynamic]
version = { attr = "omniturn_cam.__version__" }

[tool.setuptools.package-data]
omniturn_cam = ["data/*.toml"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tests/data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
  "E741",    # l / O / I names: used for G-code words (l = peck retract feed)
  "E731",    # small lambdas as local helpers are fine
  "B023",    # closures here are called inside the loop iteration that defines them
  "SIM102", "SIM105", "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"freecad_workbench/*" = ["E402"]
