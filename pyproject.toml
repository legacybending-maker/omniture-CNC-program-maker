[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omniturn-cam"
version = "0.1.0"
description = "Conversational 2D lathe CAM for OmniTurn gang-tool lathes: profile in, OmniTurn G-code out"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
step = ["cadquery-ocp>=7.7"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[project.scripts]
omniturn-cam = "omniturn_cam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
