# Publishes a GitHub release when a version tag (vX.Y.Z) is pushed to main.
# See docs/RELEASING.md. Runs the full standalone test suite again first, and
# refuses if the tag doesn't match __version__ / package.xml or the changelog
# has no section for it.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must be on main
        run: git branch -r --contains "$GITHUB_SHA" | grep -qx '  origin/main' || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - name: Tag, version and changelog must agree
        run: |
          v="${GITHUB_REF_NAME#v}"
          pv=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('src/omniturn_cam/__init__.py').read())[1])")
          [ "$v" = "$pv" ] || { echo "::error::tag $v but __version__ is $pv"; exit 1; }
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no ## [$v] section"; exit 1; }
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          cat notes.md
      - name: Libraries Qt needs for the headless GUI tests
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: pip install -e ".[all,dev]" build
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -rs
      - name: Build
        run: python -m build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "omniturn-cam ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
