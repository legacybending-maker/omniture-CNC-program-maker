name: Bug or wrong G-code
description: Something works wrong, crashes, or writes a program that isn't right
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If a program did something unexpected **on the machine**, say so first. Attach the job file
        (.toml) and the program (.cnc) if you can, plus your tools.toml and machine.toml.
  - type: dropdown
    id: where
    attributes:
      label: Where did it show up?
      options:
        - On the machine (program ran)
        - F4 Verify / backplot on the control
        - In omniturn-cam (GUI, CLI, rules check)
        - FreeCAD workbench
        - Model import (STEP / STL / 3MF)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what should have happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: The job, the operation, the values you entered.
  - type: textarea
    id: code
    attributes:
      label: Program lines involved
      render: text
  - type: input
    id: version
    attributes:
      label: omniturn-cam version or commit
      description: "`git describe --tags` in the install folder"
  - type: input
    id: machine
    attributes:
      label: Machine and control
      placeholder: Hardinge HLV-H, OmniTurn G4, firmware as shipped
